# Docker build, push, and deploy workflow
name: Docker CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    # cdn/ 下是提示词缩略图静态资源(jsdmirror 直接读 GitHub 仓库),
    # 不参与 Docker 构建,纯图片提交无需触发 CI/CD
    paths-ignore:
      - 'cdn/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CONTAINER_NAME: freeimg.shenzjd.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Always emit a `latest` tag so the deploy step can pull `:latest`.
          flavor: |
            latest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        continue-on-error: true
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Deploy the freshly pushed image to the production server over SSH.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"
            CONTAINER="${{ env.CONTAINER_NAME }}"

            # 站点目录随 1Panel 版本变化：新版在 /opt/1panel/www/sites/，
            # 旧版在 /opt/1panel/apps/openresty/openresty/www/sites/。两个位置都探一下。
            ENV_FILE=""
            for p in \
              "/opt/1panel/www/sites/freeimg.shenzjd.com/index/.env" \
              "/opt/1panel/apps/openresty/openresty/www/sites/freeimg.shenzjd.com/index/.env"; do
              if [ -f "$p" ]; then ENV_FILE="$p"; break; fi
            done
            if [ -z "$ENV_FILE" ]; then
              echo "❌ 未找到环境变量文件（已探测两个站点目录路径）"
              exit 1
            fi
            echo "env 文件: $ENV_FILE"

            sudo docker pull "$IMAGE"
            sudo docker stop "$CONTAINER" || true
            sudo docker rm "$CONTAINER" || true
            sudo docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              --memory=512m \
              --memory-swap=768m \
              --cpus=0.5 \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              -p 6711:3000 \
              --env-file "$ENV_FILE" \
              "$IMAGE"
            sudo docker image prune -f

            # 健康检查：容器必须 running 且端口能返回 200，
            # 否则整个 job 失败（此前 docker run 失败也会报 success）
            ok=0
            for i in $(seq 1 20); do
              if [ "$(sudo docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null)" = "true" ] \
                && curl -fsS -o /dev/null --max-time 5 http://127.0.0.1:6711/; then
                ok=1
                echo "✅ 容器就绪（第 ${i} 次探测）"
                break
              fi
              sleep 3
            done
            if [ "$ok" = "0" ]; then
              echo "❌ 容器启动后 60s 内未就绪，最近日志："
              sudo docker logs --tail 80 "$CONTAINER" || true
              exit 1
            fi