# nginx 反向代理配置(可选,若前置 nginx 到 Next standalone 服务)
# Next 服务默认监听 3000 端口(见 Dockerfile)

server {
    listen 80;
    server_name _;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Next 静态构建资源(长缓存)
    #
    # ⚠ 现在这段是「反代回 Next 进程」,等于每个 js/css/字体请求都要 Node 读盘发流,
    #   既占 CPU 也让 V8 里的文件缓冲一直涨。线上(1Panel/OpenResty)建议改成直出:
    #     location /_next/static/ {
    #         alias /app/.next/static/;          # 按实际部署路径调整(需能读到容器内该目录)
    #         expires 30d;
    #         add_header Cache-Control "public, immutable";
    #         access_log off;
    #     }
    #   路径不通时保留下面的兜底反代。
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 其余请求全部反代到 Next 服务
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
